<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ReportSelf</title><style>
:root{--canvas:#f8f3ef;--ink:#292421;--muted:#716760;--line:#ded0c5;--rose:#d96f6b;--teal:#20756f;--blue:#4067a8;--paper:#fffdfa;--note:#fff2b8}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:"Avenir Next",Inter,system-ui,sans-serif}.atelier{min-height:100vh;display:grid;grid-template-columns:minmax(320px,34vw) 1fr}.brief-form{background:#2b2521;color:#fff8ef;padding:34px;display:flex;flex-direction:column;gap:24px}.mark{width:70px;height:70px;border-radius:50% 50% 50% 10px;background:var(--rose);display:grid;place-items:center;font:900 24px Georgia,serif}.brief-form h1{font:700 44px/1 Georgia,serif;margin:0}.brief-form p{margin:0;color:#d8c8bd;line-height:1.55}.quick{display:flex;gap:10px;flex-wrap:wrap}.quick a,.quick button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff8ef;border-radius:999px;padding:10px 12px;text-decoration:none;font-weight:800;cursor:pointer}.quick #runResearch{background:var(--teal);border-color:var(--teal);color:white}.quick .soft{background:var(--rose);border-color:var(--rose);color:#2b1513}.field{display:grid;gap:8px}label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#d8c8bd;font-weight:900}textarea,input,select{width:100%;border:0;border-radius:18px;background:#fff8ef;color:#2b2521;padding:14px 15px;font:15px Inter,system-ui,sans-serif}textarea{min-height:210px;resize:vertical;line-height:1.5}select{appearance:auto}#runResearch{background:var(--teal);color:white;border:0;border-radius:18px;padding:14px 16px;font-weight:900;cursor:pointer}.studio{padding:28px;display:grid;grid-template-rows:auto 1fr;gap:20px}.studio-header{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:var(--paper);border:1px solid var(--line);border-radius:28px 28px 28px 8px;padding:16px;box-shadow:0 14px 36px rgba(92,68,50,.07)}.metric small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900}.metric strong{display:block;margin-top:8px;font-size:29px}.canvas{display:grid;grid-template-columns:1fr 1.08fr;gap:20px;align-items:start}.pinboard{background:#eadfd6;border:1px solid var(--line);border-radius:34px;padding:20px;min-height:560px}.pinboard h2,.manuscript h2{font:700 26px Georgia,serif;margin:0 0 14px}.claim-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{background:var(--note);border:1px solid #e5d278;border-radius:4px;padding:14px;box-shadow:0 12px 20px rgba(91,76,31,.12);transform:rotate(-.4deg)}.item:nth-child(even){background:#dff2ed;transform:rotate(.6deg)}.item strong{display:block;color:#2e4f80;margin-bottom:8px}.item p{margin:0;color:#514a43;font-size:13px;line-height:1.5}.badge{display:inline-flex;margin:0 6px 8px 0;border-radius:999px;padding:4px 8px;background:white;color:var(--teal);font-size:11px;font-weight:900}.badge.low{color:var(--blue)}.manuscript{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 24px 70px rgba(92,68,50,.1)}pre{margin:0;background:transparent;white-space:pre-wrap;max-height:680px;overflow:auto;color:#2d2824;font:14px/1.65 Georgia,serif}@media(max-width:1050px){.atelier,.canvas,.studio-header,.claim-grid{grid-template-columns:1fr}.brief-form h1{font-size:36px}}</style></head><body><main class="atelier"><aside class="brief-form"><div class="mark">RS</div><div><h1>ReportSelf</h1><p>Turn any topic into a citation-backed research report with a council of planning, research, critique, and writing agents.</p></div><div class="quick"><button id="runResearch">Run research agents</button><button id="example" class="soft">Use example</button><a href="/docs">API docs</a></div><div class="field"><label>Topic</label><textarea id="topic">RAG evaluation for enterprise AI systems</textarea></div><div class="field"><label>Audience</label><input id="audience" value="CTO and platform engineering leads"></div><div class="field"><label>Depth</label><select id="depth"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div></aside><section class="studio"><div class="studio-header"><div class="metric"><small>Tasks</small><strong id="taskCount">--</strong></div><div class="metric"><small>Claims</small><strong id="claimCount">--</strong></div><div class="metric"><small>Critiques</small><strong id="critiqueCount">--</strong></div><div class="metric"><small>Confidence</small><strong id="confidence">--</strong></div></div><div class="canvas"><section class="pinboard"><h2>Claim Pinboard</h2><div id="claims" class="claim-grid"></div></section><section class="manuscript"><h2>Generated Brief</h2><pre id="report">Waiting for research request...</pre></section></div></section></main><script src="/static/app.js"></script></body></html>
